<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Örneği</title>
</head>
<body>
    <main>
        <section style="background-color: lightblue; padding: 20px; border: 1px solid black;">
            <h1 style="color: darkblue;">Merhaba Dünya!</h1>
            <p style="font-size: 18px; color: darkred;">Bu bir inline CSS örneğidir.</p>
        </section>
        <section style="background-color: lightgreen; padding: 20px; border: 1px solid black; margin-top: 20px;">
            <h2 style="color: darkgreen;">Başka Bir Bölüm</h2>
            <p style="font-size: 16px; color: darkorange;">Bu da başka bir inline CSS örneğidir.</p>    
        </section>
    </main>
</body>
</html>
