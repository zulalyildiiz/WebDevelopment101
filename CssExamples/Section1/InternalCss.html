<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS Örneği</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        section {
            background-color: lightblue;
            padding: 20px;
            border: 1px solid black;
            margin-bottom: 20px;
        }

        h1 {
            color: darkblue;
        }

        h2 {
            color: darkgreen;
        }

        p {
            font-size: 18px;
            color: rgb(255, 255, 255);
        }
    </style>
</head>

<body>
    <main>
        <section>
            <h1>Merhaba Dünya!</h1>
            <p>Bu bir internal CSS örneğidir.</p>
        </section>
        <section>
            <h2>Başka Bir Bölüm</h2>
            <p>Bu da başka bir internal CSS örneğidir.</p>
        </section>
    </main>

</body>

</html>
