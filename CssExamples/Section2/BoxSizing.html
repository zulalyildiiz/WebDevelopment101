<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boz Sizing Örneği</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        #showcase {
            background-color: #4376ad;
            height: 300px;
            width: 100%;
            padding: 50px;
            border: 5px solid rgb(255, 174, 0);
        }

        .movie-card {
            background-color: white;
            width: 300px;
            height: 200px;
            padding: 20px;
            border: 10px solid #7cfcad;
            border-radius: 10px;
            color: #333333;
        }

        #how-it-works {
            background-color: #7cebfc;
            padding: 20px;
            border: #970b74 solid 5px;
        }
    </style>
</head>

<body>
    
    <main>
        <section id="showcase">
            

            <div class="movie-card">
                <h3>Yıldızlararası</h3>
                <p>Bilim kurgu ve macera dolu bir yolculuk.</p>  
            </div>

        </section>

        <section id="how-it-works">
            <h2>How it works?</h2>
        </section>
    </main>
</body>

</html>
