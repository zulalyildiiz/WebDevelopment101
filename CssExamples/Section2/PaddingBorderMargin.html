<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            border: 2px solid white;
        }

        #sec2 {
            background-color: lightblue;
            padding: 40px;
            border: 5px solid rgb(27, 129, 11);
            margin: 10px;
            width: 500px;
        }

        #sec1 {
            background-color: lightgreen;
            padding: 40px;
            border: 5px solid rgb(38, 0, 255);
            margin: 10px;
            width: 500px;
        }
    </style>
</head>

<body>
    <main>
        <section id="sec1">
            <h1>Box Model Örneği</h1>
            <h3>Bu bölüm, CSS Box Model'ini göstermektedir.</h3>
        </section>
        <section id="sec2">
            <h1>Box Model Nedir?</h1>
            <h3>CSS Box Model, bir HTML öğesinin içeriği, dolgu (padding), kenarlık (border) ve dış boşluk (margin) gibi
                dört ana bileşenden oluştuğunu tanımlar.</h3>
        </section>
    </main>
</body>

</html>
