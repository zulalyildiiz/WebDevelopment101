<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=ü, initial-scale=1.0">
    <title>tr</title>
    <style>
        .boxInlineBlock {
            display: inline-block;
        }

        .boxBlock {
            display: block;
        }

        .boxInline {
            display: inline;
        }

        #first-box {
            width: 100px;
            height: 100px;
            background-color: blue;
        }

        #second-box {
            width: 100px;
            height: 100px;
            background-color: green;
        }

        #third-box {
            width: 100px;
            height: 100px;
            background-color: red;
        }
    </style>
</head>

<body>
    <h1>Display Örnekleri - Inline-Block</h1>
    <section>
        <div class="boxInlineBlock" id="first-box">Box 1</div>
        <div class="boxInlineBlock" id="second-box">Box 2</div>
        <div class="boxInlineBlock" id="third-box">Box 3</div>
    </section>

    <h1>Display Örnekleri - Block</h1>
    <section>
        <div class="boxBlock" id="first-box">Box 1</div>
        <div class="boxBlock" id="second-box">Box 2</div>
        <div class="boxBlock" id="third-box">Box 3</div>
    </section>

    <h1>Display Örnekleri - Inline</h1>
    <section>
        <div class="boxInline" id="first-box">Box 1</div>
        <div class="boxInline" id="second-box">Box 2</div>
        <div class="boxInline" id="third-box">Box 3</div>
    </section>

</body>

</html>
