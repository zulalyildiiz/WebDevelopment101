<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>,
    <style>
        * {
            box-sizing: border-box;
        }

        .box {
            border: 2px solid rgb(255, 255, 255);
            padding: 5px 10px;
            display: inline-block;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #2c0e70;
            padding: 10px 20px;
        }

        header {
            color: white;
            font-weight: bold;
            width: 100%;
        }

        header nav {
            display: inline-block;
            width: 91%;
            text-align: right;
        }

        header>nav a {
            color: white;
            text-align: center;
        }


        #showcase ul li a:link {
            color: rgb(243, 235, 235);
            padding: 5px 10px;
        }

        #showcase ul li a:visited {
            color: rgb(61, 6, 56);
            padding: 5px 10px;
        }

        #showcase ul li a:hover {
            color: rgb(29, 16, 213);
            padding: 5px 10px;
        }

        #showcase ul li a:active {
            color: rgb(20, 215, 10);
            padding: 5px 10px;
        }

        #showcase {
            background-color: #2E4C6D;
            height: 500px;
            width: 100%;
            padding: 20px;
            color: white;
            text-align: center;
            font-size: large;
        }

        #showcase ul {
            padding-left: 0px;
        }

        #showcase ul li {
            display: inline-block;
            margin-right: 20px;
            border: rgb(255, 255, 255) solid 2px;
        }

        #showcase ul li a {
            color: white;
        }
    </style>

</head>

<body>
    <header>
        <label for="movie-app">MovieApp</label>
        <nav>
            <ul>
                <li class="box"><a href="#"><h3>Home</h3></a></li>
                <li class="box"><a href="#"><h3>Movies</h3></a></li>
                <li class="box"><a href="#"><h3>Contact</h3></a></li>
            </ul>
        </nav>
    </header>
    <section id="showcase">
        <h1>Welcome to MovieApp</h1>
        <hr>
        <h2>Discover the best movies and TV shows</h2>
        <hr>
        <nav>
        <ul>
            <li class="box"><a href="../../HtmlExamples/Example-2/TheShawnshankRedeption.html" target="_blank"><h3>Shawnshank
                    Redemption</h3></a></li>
            <li class="box"><a href="../../HtmlExamples/Example-2/TheGodfather.html" target="_blank"><h3>The Godfather</h3></a>
            </li>
            <li class="box"><a href="../../HtmlExamples/Example-2/TheDarkKnight.html" target="_blank"><h3>The Dark
                    Knight</h3></a></li>
        </ul>
    </section>

</body>

</html>
