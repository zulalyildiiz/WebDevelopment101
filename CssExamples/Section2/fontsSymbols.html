<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts and Symbols Examples</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <h1>Fonts and Symbols Examples</h1>
    <p>This is an example of using different fonts and symbols in HTML.</p>
    <p style="font-family: 'Courier New', Courier, monospace;">This text is in Courier New font.</p>
    <p style="font-family: 'Arial', sans-serif;">This text is in Arial font.</p>
    <p style="font-family: 'Times New Roman', Times, serif;">This text is in Times New Roman font.</p>
    <p>Here are some symbols: &#9733; &#9734; &#9829; &#9830; &#9824; &#9827;</p>

    <nav>
        <ul>
            <li class="box"><a href="#">
                    <h3><i class="fa-solid fa-bars"></i> MENU</h3>
                </a></li>
            <li class="box"><a href="#">
                    <h3><i class="fa-regular fa-address-book"></i>Contact</h3>
                </a></li>
            <li class="box"><a href="#">
                    <h3><i class="fa-solid fa-user"></i>Profile</h3>
                </a></li>
        </ul>
    </nav>
</body>

</html>
