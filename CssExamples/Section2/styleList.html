<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled List</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        #showcase {
            background-color: #2E4C6D;
            height: 500px;
            width: 100%;
            padding: 10px;
        }

        #how-it-works {
            background-color: #FC997C;
            padding: 10px;
        }

        .main-header {
            background-color: #FC997C;
        }

        .styledList {
            list-style: upper-latin;
            padding-left: 0px;
            border: #2E4C6D solid 2px;
            background-color: aqua;
            width: 200px;
            height: 200px;
            text-align: center;
            display: inline-block;
        }
    </style>
</head>

<body>

    <header>
        <a href="#">MovieApp</a>
        <nav>
            <ul>
                <li class="styledList">
                    <a href="#">Home</a>
                </li>
                <li class="styledList">
                    <a href="#">Movies</a>
                </li>
                <li class="styledList">
                    <a href="#">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="showcase">
            <h1>Welcome to MovieApp</h1>
        </section>
        <section id="how-it-works">
            <h2>How it works?</h2>
        </section>
    </main>

</body>

</html>
