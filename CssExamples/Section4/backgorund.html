<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0px;
        }

        #header {
            background-image: linear-gradient(to bottom right, rgba(195, 0, 255, 0.6), rgba(229, 115, 16, 0.6)), url("../media/bg.jpg");
            height: 100vh;
            background-size: cover;
            position: relative;
            background-position: 10px 10px;
            background-repeat: no-repeat;
        }

        #header h1 {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 80px;
            transform: translate(-50%, -50%);
            color: red;
        }

        .cover {
            background-color: aqua;
            top: 0;
            left: 0;
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.2;
        }

        
    </style>
</head>

<body>
    <div id="header">
        <h1>Backgorund Text</h1>
        <!-- <div class="cover"></div> -->
        <div class="cover2"></div>
    </div>
</body>

</html>
